apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-api-prod
  labels:
    app.kubernetes.io/name: demo-api
  namespace: argocd
spec:
  project: demo-prod
  source:
    repoURL: https://github.com/1056604657/cicd.git
    targetRevision: main
    path: gitops/apps/demo-api/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-prod
  revisionHistoryLimit: 10
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - CreateNamespace=false
    - PruneLast=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
  - group: networking.istio.io
    kind: VirtualService
    name: demo-api
    jsonPointers:
    - /spec/http/0/route/0/weight
    - /spec/http/0/route/1/weight
  - group: ''
    kind: Service
    name: demo-api
    jsonPointers:
    - /spec/selector/rollouts-pod-template-hash
  - group: ''
    kind: Service
    name: demo-api-canary
    jsonPointers:
    - /spec/selector/rollouts-pod-template-hash
  - group: argoproj.io
    kind: Rollout
    name: demo-api
    jsonPointers:
    - /spec/replicas
