spring:
  application:
    name: demo-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
app:
  message: ${APP_MESSAGE:Hello}
  version: ${APP_VERSION:local}
logging:
  structured:
    format:
      console: ecs
