apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-auth
  namespace: demo-test
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: demo-api
spec:
  provider:
    vault:
      server: https://vault.example.com
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes-test
          role: gateway-test
          serviceAccountRef:
            name: vault-auth
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: demo-test-tls
  labels:
    app.kubernetes.io/name: demo-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: demo-test-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: cicd/test/tls
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: cicd/test/tls
      property: tls.key
