apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: demo-test
  labels:
    app.kubernetes.io/name: demo-api
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - demo-test/demo-test.example.com
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - demo-test/demo-test.example.com
    tls:
      mode: SIMPLE
      credentialName: demo-test-tls
